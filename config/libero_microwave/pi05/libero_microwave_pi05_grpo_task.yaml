# @package _global_
defaults:
  - /libero_object_grpo_openpi_pi05@_global_
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

runner:
  logger:
    log_path: /PROJECT_ROOT/logs
    project_name: libero_microwave_task
    experiment_name: libero_microwave_pi05_grpo_task
    logger_backends:
      - wandb
    num_eval_videos: 8
  max_epochs: 500
  val_check_interval: 1
  save_interval: 10

algorithm:
  kl_penalty_type: low_var_kl
  group_size: 4
  rollout_epoch: 1
  eval_rollout_epoch: 6
  update_epoch: 2
  kl_beta: 0
  log_max_groups: 8

env:
  enable_offload: false
  train:
    task_suite_name: libero_microwave
    total_num_envs: 32
    group_size: ${algorithm.group_size}
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    ignore_terminations: true
    reward_coef: ${algorithm.reward_coef}
  eval:
    task_suite_name: libero_microwave
    total_num_envs: 48
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    video_cfg:
      save_video: false

rollout:
  unnorm_key: null
  model:
    model_path: /PROJECT_ROOT/models/RLinf-Pi05-LIBERO-SFT

actor:
  micro_batch_size: 32
  global_batch_size: 512
  model:
    model_path: /PROJECT_ROOT/models/RLinf-Pi05-LIBERO-SFT
  optim:
    lr: 1e-5

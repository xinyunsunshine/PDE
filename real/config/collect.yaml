defaults:
  - osc
  - task: tabletop
  - _self_

# AgileX gripper over CAN — lives at the top level because
# AgileXGripper reads cfg.gripper.{CAN,torque}.
gripper:
  CAN: can_gripper
  torque: 2  # Nm

# ------------------------------------------------------------------
# Teleop data collection settings.
#
# Required overrides on the CLI:
#   collect.dataset_root=/abs/path/to/lerobot_datasets
#   collect.repo_id=my_task_v1
#   collect.task_prompt="pick up the red block"
#
# The collector is resume-safe: re-running with the same dataset_root +
# repo_id appends new episodes to the existing dataset, including with a
# different task_prompt — the prompt is recorded per-frame so a single
# dataset can mix multiple distinct prompts across collection sessions.
# Schema drift (camera resolution, fps, video vs image storage) is checked
# against meta/info.json before any frames are written; mismatches raise.
# ------------------------------------------------------------------
collect:
  dataset_root: ???
  repo_id: ???
  task_prompt: ???

  # Dataset sampling rate. Should match robot.freq — the control loop is
  # rate-limited by aiofranka's set_freq() so every env.step produces one
  # frame at this rate.
  fps: 50

  # Gripper widths (meters). AgileX physical range is [0, 0.069].
  # The SpaceMouse gripper button toggles between these two targets.
  gripper_open_width: 0.069
  gripper_closed_width: 0.004

  # SpaceMouse polling rate (Hz). Must be >= fps so deltas stay fresh.
  spacemouse_freq: 100

  # LeRobot writer options. use_videos=true stores rgb as mp4 (smaller,
  # needs ffmpeg). Set to false to store per-frame pngs instead.
  use_videos: true
  image_writer_threads: 16

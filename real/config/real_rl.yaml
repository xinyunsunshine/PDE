defaults:
  - osc
  - task: tabletop
  - _self_

gripper:
  CAN: can_gripper
  torque: 2  # Nm


inference:
  server:
    host: "localhost"
    port: 8000

  # Executed positions per chunk. The VLA emits chunk_size=50 actions per
  # inference; we execute chunk[valid_start : valid_start + execute_k] (the
  # first valid_start positions are dropped to compensate for inference
  # latency). Smaller -> tighter closed-loop control. Larger -> fewer
  # inference calls per rollout, so PPO has fewer (E, T) decision points.
  #
  # PPO scoring across the 50-position chunk is a TRAINER-side concern:
  # the policy emitted all 50 positions, but only positions
  # [valid_start, valid_start + execute_k) actually moved the robot.
  # valid_start and execute_k are stored per-step in each rollout HDF5;
  # the trainer should construct an is_executed mask of shape
  # (E, T, chunk_size) and use it to mask per-position logprobs before
  # reducing over the chunk axis. See real_rl.py docstring for the
  # one-liner.
  execute_k: 16


  action_clip:
    xyz_norm_m: 0.045     
    rot6d_per_dim: null
    grip: null


rl:
  # Where to write HDF5s. Pass the same run_root again to resume / advance to the next iteration.
  # run_root: ./real_rl_runs/${now:%Y%m%d_%H%M%S}
  run_root: ???

  num_envs: 32
  # Inference calls per rollout (T axis of (E, T, ...) tensors). Approx
  # control-step budget = horizon * execute_k. With execute_k=16 the
  # default below gives ~32 * 16 = ~512 control steps (~10 s at 50 Hz).
  horizon: 32

  # Optional: pin the iteration number. If null, auto-detected
  iteration: null

  # Per-env prompts JSON. If null, the script auto-resolves to
  #   <run_root>/iteration{K:03d}/itr{K:02d}_prompt.json
  # where K is the next iteration (operator/trainer must have dropped this
  # file before launch). Pass an explicit absolute path here to override.
  prompts_path: null

  store_images: true            # set false for fast smoke-tests
  image_compression: "gzip"     # "gzip" or "none"
  image_compression_level: 4
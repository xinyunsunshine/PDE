defaults:
  - osc
  - task: tabletop
  - _self_

# AgileX gripper over CAN — same as deploy.yaml / collect.yaml; the replay
# controller path is identical to deploy's.
gripper:
  CAN: can_gripper
  torque: 2

# Checkpoint is only consulted to load norm stats + data transforms for the
# round-trip mode. ``full_weights.pt`` does NOT need to be present — we
# never load policy weights here. Point this at the same stage_dir that
# ``real/run_vla_server.sh`` uses so we're testing against the exact
# transforms the live server would apply.
inference:
  config_name: "pi05_fr3vla"
  checkpoint: ???

# LeRobot dataset to replay from. Matches the layout produced by
# ``real/collect_sft_data.py``: ``<root>/<repo_id>/meta/info.json``.
dataset:
  root: ???
  repo_id: ???

replay:
  # ``round_trip`` pipes each stored action through Normalize then
  # Unnormalize (see real/replay_transforms.py) before execution — verifies
  # the VLA server's transform chain is self-inverse. ``raw`` plays the
  # dataset's absolute actions untouched — baseline sanity that the
  # controller + env can reproduce recorded teleop at all.
  mode: "round_trip"

  # null → interactive prompt ("pick an episode 0..N-1"). Set on the CLI
  # (``replay.episode_idx=3``) to skip the prompt.
  episode_idx: null

  # Round-trip diff tolerance. If any per-timestep, per-dim abs diff exceeds
  # this, we abort before touching the robot so the user can investigate.
  tolerance: 1.0e-3

  # After one rollout finishes, prompt for another episode instead of
  # exiting. Set false for scripted single-episode runs.
  interactive: true

  # JSONL log of (episode_idx, mode, steps, label, max_diff) per rollout.
  log_path: "./recordings/replay_log.jsonl"

defaults:
  - _self_

# ------------------------------------------------------------------
# Pi0(.5) inference settings. Mirrors vla_server.yaml — pass the same
# weights / norm_stats / config_name you'd use to launch the server.
# ------------------------------------------------------------------
inference:
  weights: ???
  norm_stats: ???
  config_name: "pi05_fr3vla_pde_2cam"
  device: "cuda:0"
  default_prompt: "put the pear in the bowl"

  # Override OpenPi0Config defaults (5/7) so logprob/output slicing matches
  # the FR3 deployment's executed-chunk shape.
  action_chunk: 50
  action_env_dim: 10

# ------------------------------------------------------------------
# Calibration source + thresholds. Sweeping happens in the `sweep` block.
# ------------------------------------------------------------------
calibration:
  # Path to a real_rl iterationNNN/ directory containing rolloutNNN.h5 files.
  iter_dir: ???

  # Number of obs frames to evaluate. 32-64 is plenty for stable percentiles.
  n_obs: 32

  # Seeds per (setting, obs). 5 gives a reasonable between-seed std estimate
  # without blowing up runtime.
  n_seeds: 5

  # Master RNG for frame sampling + per-call seeds. Reruns with the same
  # seed will pick the same frames.
  seed: 0

  # Output path. Pass an absolute path or it'll land under hydra's run dir.
  out_csv: ./noise_calibration.csv

  # Hardware-safety thresholds (constraint 1). Tune these to your FR3
  # cell's actual workspace + reachable Δ-per-control-step. Defaults are
  # conservative (2 cm, ~5°, 0.05 gripper unit).
  max_delta_xyz_m: 0.02
  max_delta_rot_rad: 0.087
  max_delta_grip: 0.05

  # Action layout (FR3 = xyz(3) + rot6d(6) + grip(1)). Adjust if your
  # action_dim layout differs. Slices are [lo, hi) — Python convention.
  dim_slice_xyz: [0, 3]
  dim_slice_rot: [3, 9]
  dim_slice_grip: [9, 10]

# ------------------------------------------------------------------
# Sweep grid. Cartesian product is taken across all three lists.
# Restrict to flow_sde / flow_cps — flow_noise needs the model to be
# constructed with that method (it builds an extra ExploreNoiseNet head).
# ------------------------------------------------------------------
sweep:
  noise_method: ["flow_sde"]
  noise_level: [0.05, 0.10, 0.20, 0.35, 0.50]
  joint_logprob: [false, true]

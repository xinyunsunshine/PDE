defaults:
  - libero
  - _self_

search:
  task_index: ???
  task_id: ???
  output: ???
  provider: local_qwen # openai or local_qwen (OpenAI-compatible server)
  vlm_model: null # provider default; override with the server model ID
  base_url: null # local_qwen: QWEN_BASE_URL or http://127.0.0.1:8000/v1
  temperature: 0.8 # set null for models that do not accept temperature
  frames_per_video: 8
  budget:
    iterations: 10
    candidates_per_iteration: 5
    rollouts_per_candidate: 10
    admission_threshold: 0.0

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-driven-exploration"
version = "0.1.0"
description = "Prompt-Driven Exploration for VLA reinforcement learning"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "PDE Authors"}]
keywords = ["vision-language-action", "reinforcement-learning", "robotics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://xinyunsunshine.github.io/prompt-rl"
Repository = "https://github.com/xinyunsunshine/PDE"
Issues = "https://github.com/xinyunsunshine/PDE/issues"

[project.scripts]
pde = "pde.cli:main"

[project.optional-dependencies]
integration = ["openai", "Pillow", "hydra-core"]
test = ["pytest", "ruff", "hydra-core", "torch", "openai", "Pillow", "numpy", "httpx"]

[tool.setuptools.packages.find]
include = ["pde*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pde = ["configs/*.yaml", "examples/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["RLinf"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

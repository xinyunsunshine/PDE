name: release-checks

on:
  push:
  pull_request:

jobs:
  pde-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - run: ruff check pde tests
      - run: python scripts/release_audit.py .

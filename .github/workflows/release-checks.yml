name: release-checks

on:
  push:
  pull_request:

jobs:
  pde-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: pytest -q tests/unit_tests/test_pde_release.py
      - run: python scripts/release_audit.py .

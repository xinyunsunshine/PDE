# @package _global_
# bifranka real-world GRPO on pi0.5, group_size=32.
#
# Inherits from realworld_grpo_openpi_pi05 and changes:
#   - group_size 4 → 32: the entire 32-episode batch is one GRPO group, so
#     advantages are normalised globally across all episodes. Prompt allocation
#     on bifranka no longer requires the stride-8 interleave — the operator can
#     assign prompts arbitrarily across the 32 robot slots.
#   - Checkpoints land in ./logs (repo-local) instead of the shared archive.
#   - All paths aligned to run name "meta_green_bowl_grpo_gs32".
#   - resume_dir: null (starts from SFT init or auto-detects latest ckpt).
#
# Constraint note: validate_cfg checks
#   total_num_envs // env_world_size // pipeline_stage_num % group_size == 0
# env is pinned to GPU 0 (env_world_size=1, NoOpEnv): 32 // 1 // 1 % 32 == 0. ✓
#
# Actor/rollout are ALSO pinned to GPU 0 (actor_world_size=1). This is
# REQUIRED for group_size=32: the per-rank advantage normalization in
# rlinf/algorithms/utils.py:143 does `scores.reshape(-1, group_size)`, so
# each rank must hold ≥ group_size envs. With 32 envs total and
# actor_world_size=1, that single rank holds all 32 → reshape fits and the
# whole batch is one GRPO group, as intended. If you instead let actor
# inherit `all` from the parent (actor_world_size=8), each rank only sees
# 32 // 8 = 4 envs and the reshape blows up with
#   RuntimeError: shape '[-1, 32]' is invalid for input of size 4.
# pi0.5 (~7 GB params + ~25 GB Adam + ~7 GB grads) fits on a single H100.

defaults:
  - /realworld_grpo_openpi_pi05@_global_
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

runner:
  bifranka_dest: "user@robot.example.com:/home/user/real_rl_runs_her/meta_green_bowl_baseline_gs32_nl01"
  resume_dir: /PROJECT_ROOT/repo/logs/realworld_grpo_gs32_kl1em3_lr2em6/checkpoints/global_step_5
  logger:
    log_path: ./logs
    experiment_name: "realworld_grpo_gs32_kl1em3_lr2em6"
    project_name: realworld_task
    logger_backends: ["wandb"]

rollout:
  realworld:
    rollout_dir: /PROJECT_ROOT/repo/realworld_rollouts/meta_green_bowl_baseline_gs32_nl01
    remote_dest: "user@robot.example.com:/home/user/real_rl_runs_her/meta_green_bowl_baseline_gs32_nl01"

cluster:
  component_placement:
    actor: 0    # actor_world_size=1; one rank holds all 32 envs → group_size=32 reshape fits
    rollout: 0  # collocated with actor on GPU 0
    env: 0      # NoOpEnv needs 1 process; env_world_size=1 so 32 // 1 % 32 == 0

algorithm:
  group_size: 32

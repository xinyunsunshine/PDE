# @package _global_
# bifranka real-world HER-dual on pi0.5 using meta_green_bowl rollouts.
#
# Inherits from realworld_her_dual_openpi_pi05 (GRPO group_size=4, low-var KL
# anchor, HER-dual paired mini-batches, thinking VLM backend) and points to the
# existing meta_green_bowl_baseline rollout dir with bifranka sync disabled so
# the trainer consumes locally-cached HDF5 without waiting for live recordings.
#
# Note: realworld_grpo_openpi_pi05 (grandparent) sets resume_dir to a GRPO
# checkpoint; override to null here so training initialises from the SFT init
# (actor.model.model_path) rather than loading a GRPO actor state-dict.

defaults:
  - /realworld_her_dual_openpi_pi05@_global_
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

runner:
  bifranka_dest: ""
  resume_dir: null
  logger:
    log_path: /PROJECT_ROOT/checkpoints/her_dual_meta_green_bowl
    experiment_name: "her_dual_meta_green_bowl"

rollout:
  realworld:
    rollout_dir: /PROJECT_ROOT/repo/realworld_rollouts/meta_green_bowl_baseline
    remote_dest: ""

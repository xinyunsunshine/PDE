# bifranka real-world PPO on pi0.5 (OpenPI).
#
# Pipeline: bifranka inference server records 32 robot episodes → trainer
# rsyncs HDF5 → recomputes prev_logprobs → PPO → scp's full_weights.pt back.
# See readme/realworld-rl/README.md (in the upstream repo) for operator instructions.
#
# Differences from the canonical curriculum config in the upstream repo:
#   - No runner.prompt_opt block (curriculum / EMA prompt allocation deferred).
#   - Operator supplies itr{N+1:02d}_prompt.json on bifranka by hand.
#   - runner.runner_class: realworld (not realworld_curriculum).

defaults:
  - env/realworld_bifranka@env.train
  - env/realworld_bifranka@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: all
    env: all
    rollout: all

runner:
  task_type: embodied
  runner_class: realworld
  # The ckpt that was trained on iteration N's data lands at
  #   <bifranka_dest>/iteration{N:03d}/train_after_itr{N}_model.pt
  # i.e., next to bifranka's recording of that iteration's data.
  bifranka_dest: "user@robot.example.com:/home/user/real_rl_runs/REPLACE_WITH_RUN_NAME"
  scp_cipher: "aes128-gcm@openssh.com"
  heartbeat_interval_s: 1500  # 25 min — keep ssh multiplex socket warm

  logger:
    log_path: "../results"
    project_name: realworld   # bare suite name; run scripts may prepend train_/eval_
    experiment_name: "realworld_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1      # realworld eval happens on the robot itself
  save_interval: 1            # save + scp every PPO update
  keep_interval: 0            # bifranka only needs the latest

  resume_dir: null            # auto-detects latest global_step_* if unset
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1            # one PPO outer step per bifranka iteration
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  # PPO early stops if mean approx_kl across microbatches exceeds target_kl.
  target_kl: 0.05

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  # Light KL anchor toward the SFT init. Required: kl_penalty_type=low_var_kl
  # so the FSDP actor's kl_penalty arg-swap doesn't anti-regularize.
  kl_beta: 0.001
  kl_penalty_type: low_var_kl
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False
  # train and eval blocks inherited from env/realworld_bifranka.yaml defaults.

rollout:
  group_name: "RolloutGroup"
  generation_backend: "realworld"
  recompute_logprobs: False
  collect_prev_infos: False
  enable_offload: False
  pipeline_stage_num: 1

  realworld:
    # Local path the worker rsyncs into. Each iterationNNN/ subdir lands here
    # once bifranka commits iteration_complete.json.
    rollout_dir: /PROJECT_ROOT/repo/realworld_rollouts/REPLACE_WITH_RUN_NAME
    # Bifranka source (user@host:/abs/path). Set to "" to bypass bifranka and
    # use rollout_dir as the only source (useful for dry-run testing).
    remote_dest: "user@robot.example.com:/home/user/real_rl_runs/REPLACE_WITH_RUN_NAME"
    scp_cipher: "aes128-gcm@openssh.com"
    episodes_per_iteration: 32
    # In chunk-steps. With max_episode_steps=512 robot steps / num_action_chunks=16
    # → 32 chunk-steps per episode.
    max_episode_steps: 32
    poll_interval_s: 60.0
    heartbeat_interval_s: 60
    accept_model_weights_id_after: ""

  model:
    # The realworld inference server runs on bifranka; this path is only used
    # by the trainer's rollout worker for re-loading weights when recomputing
    # logprobs locally. Set to the same pi05 SFT init that bifranka boots from.
    model_path: "REPLACE_WITH_PI05_SFT_PATH"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # T*B chunk-step samples per outer iter ≈ 32 chunk-steps × 32 episodes = 1024.
  # global_batch_size must be divisible by micro_batch_size × actor_world_size:
  # 32 × 8 = 256, 512 % 256 == 0. ✓
  micro_batch_size: 32
  global_batch_size: 512
  seed: 42
  enable_offload: False

  model:
    model_path: "REPLACE_WITH_PI05_SFT_PATH"
    num_action_chunks: 16
    # FR3 + AgileX gripper: 3 EE pos + 6 rot6d + 1 gripper = 10 dims.
    action_dim: 10
    model_type: "openpi"
    add_value_head: True
    openpi:
      # pi05_fr3vla: FR3 dataconfig + smaller value_head matching the FR3 SFT.
      config_name: "pi05_fr3vla"
      noise_level: 0.3
      # MUST match the recorded chain length in the HDF5 (chains shape [T, 11, 50, 32]).
      num_steps: 10
      # MUST match the SFT init's value_head input dim.
      value_after_vlm: False
      joint_logprob: False
      # action_chunk / action_env_dim are unused by the realworld masked-sum
      # forward path but kept consistent so they don't drift.
      action_chunk: 16
      action_env_dim: 10

  optim:
    # Validated stable. lr=1e-5 hit occasional bf16 grad-NaN; 2e-6 has not.
    lr: 2.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    # no_shard = DDP-style: full model copy per rank. Pi0.5 (~7GB params +
    # ~25GB Adam + ~7GB grads) fits per H100 (80GB) without sharding.
    sharding_strategy: "no_shard"
    # OpenPI's PaliGemma + action expert doesn't support FSDP gradient checkpointing.
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

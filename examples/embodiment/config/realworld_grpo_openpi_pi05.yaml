# @package _global_
# bifranka real-world GRPO on pi0.5. Inherits from realworld_ppo_openpi_pi05
# and switches advantage / loss / grouping.
#
# Important constraint on the prompt JSON the operator drops on bifranka:
# GRPO computes advantages within contiguous groups of `group_size` episodes
# in the batch. With total_num_envs=32, actor_world_size=8, and group_size=4,
# each actor rank trains on its 4 episodes as ONE group. The realworld
# rollout worker shards by stride (rank gets rollouts[rank::8]), so rank 0
# sees envs [0, 8, 16, 24], rank 1 sees [1, 9, 17, 25], etc. For the group
# baseline to be meaningful, those 4 envs must share a prompt — i.e. the
# operator must allocate prompts in a STRIDE-8 pattern across the 32 envs:
#     envs  0,  8, 16, 24  →  prompt A   (forms rank-0's group)
#     envs  1,  9, 17, 25  →  prompt B   (forms rank-1's group)
#     ...                     etc.
# 8 prompts × 4 trials/prompt = 32 envs. If the operator instead allocates
# contiguously (envs 0-3 = prompt A, etc.), the GRPO groups will mix
# prompts and the baseline becomes noise.

defaults:
  - /realworld_ppo_openpi_pi05@_global_
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

runner:
  # Remote bifranka delivery. After each PPO update, the runner scp's
  # logs/.../checkpoints/global_step_{N+1}/actor/model_state_dict/full_weights.pt
  # → bifranka:/home/user/real_rl_runs_her/meta_green_bowl_baseline/iteration{N:03d}/train_after_itr{N}_model.pt
  bifranka_dest: ""
  heartbeat_interval_s: 1500   # 25 min — keep ssh multiplex socket warm
  # Save checkpoints under the repo's local logs/ dir (not the shared archive).
  resume_dir: /PROJECT_ROOT/archive/checkpoints/logs/realworld_grpo_openpi_pi05/realworld_grpo_openpi_pi05/checkpoints/global_step_10
  logger:
    log_path: /PROJECT_ROOT/archive/checkpoints/logs/realworld_grpo_openpi_pi05
    experiment_name: "realworld_grpo_openpi_pi05"

rollout:
  realworld:
    # Trainer's local rsync mirror. Each iteration{NNN}/ subdir lands here
    # once bifranka commits iteration_complete.json on the remote side.
    rollout_dir: /PROJECT_ROOT/repo/realworld_rollouts/her_meta_green_bowl_grpo
    # Bifranka source for rsync polling.
    remote_dest: ""

  model:
    # FR3 pi0.5 SFT init. Used for the rollout-side prev_logprob recompute.
    # Same checkpoint bifranka's inference server boots from on iter000.
    model_path: "/PROJECT_ROOT/repo/models/vla-promptopt-realworld/real_sft/cached/global_step_2050"

actor:
  model:
    model_path: "/PROJECT_ROOT/repo/models/vla-promptopt-realworld/real_sft/cached/global_step_2050"

algorithm:
  # GRPO core switches.
  adv_type: grpo
  loss_type: actor
  # 8 prompts × 4 group members = 32 envs. Validator requires
  # total_num_envs // env_world_size // pipeline_stage_num % group_size == 0
  # → 32 // 8 // 1 = 4, 4 % 4 = 0. ✓
  group_size: 4
  # GRPO doesn't use GAE; gae_lambda is dead code but stays for schema
  # compatibility (inherited from parent).
  # Keep the parent's KL stability tuning: low-var KL anchor at 0.001,
  # asymmetric clipping at 0.2, target_kl early-stop at 0.05. These were
  # validated for realworld PPO at lr=2e-6 over many iterations; GRPO uses
  # the same numerical regime.
  kl_beta: 0.001
  kl_penalty_type: low_var_kl
  # Optional GRPO-style filter — drops groups where all envs succeed or all
  # fail (variance ~ 0 → meaningless advantage). Realworld success rates
  # are low and groups are small (size 4), so filtering aggressively risks
  # dropping most data. Leave off; revisit if KL spikes show up.
  filter_rewards: False
